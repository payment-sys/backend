spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        type:
          json_format_mapper: org.hibernate.type.format.jackson.JacksonJsonFormatMapper

toss:
  payment:
    uri: https://api.tosspayments.com/v1/payments/confirm
    secret: test-secret
    content-type: application/json
    timeout: 60

payment:
  outbox:
    limiter:
      max-result-apply-tasks: 75
    recovery:
      fixed-delay-ms: 30000
      stale-after-seconds: 60
      batch-size: 100

product:
  quantity-change-results:
    outbox-publish:
      fixed-delay-ms: 30000
      batch-size: 100
  kafka:
    consumers:
      quantity-change-result:
        topic: quantity-change-results-test
        group-id: payment-order-test
  cache:
    restore:
      fixed-delay-ms: 30000
    wal:
      path: ${PRODUCT_RESERVATION_WAL_PATH:./build/test-data/product-reservation.wal}

order:
  quantity-changes:
    producer:
      topic: quantity-changes-test
    outbox-publish:
      fixed-delay-ms: 30000
      batch-size: 100
