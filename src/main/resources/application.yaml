server:
  tomcat:
    threads:
      max: 50
      min-spare: 10
    accept-count: 100
    connection-timeout: 2000ms
    keep-alive-timeout: 5s
    mbeanregistry:
      enabled: true

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      concurrency: 8
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 500
        fetch.min.bytes: 32768
        fetch.max.wait.ms: 1000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      auto-commit: false
      maximum-pool-size: 18
      minimum-idle: 18
      connection-timeout: 1000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000
      register-mbeans: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          json_format_mapper: org.hibernate.type.format.jackson.JacksonJsonFormatMapper
        connection:
          provider_disables_autocommit: true
    open-in-view: false

payment:
  # IN_PROGRESS, UNKNOWN 상태 결제 복구 스케줄러 설정
  recovery-scheduler:
    fixed-delay-ms: 30000
    stale-after-seconds: 600
    batch-size: 100
  # Toss Payments PG 연동 설정
  toss:
    # uri: https://api.tosspayments.com/v1/payments/confirm
    uri: http://10.0.2.253:8080/v1/payments/confirm
    secret: ${TOSS_PAYMENT_SECRET}
    content-type: application/json
    timeout: 2

# Topic: <message type>.<dataset name>.<data name>
# Group ID: <domain>-<consumer role>
product:
  # Kafka 재고 차감 요청 소비 설정
  quantity-change-consumer:
    topic: command.product.quantity-change
    group-id: product-quantity-change-consumer
  # Kafka 재고 차감 결과 이벤트 생산 설정
  quantity-change-result-producer:
    topic: event.product.quantity-change-result
  # Kafka 재고 차감 결과 이벤트 아웃박스 재발행 스케줄러 설정
  quantity-change-result-outbox-scheduler:
    fixed-delay-ms: 30000
    batch-size: 100
    retry-delay-seconds: 30

order:
  # 주문 만료 처리 스케줄러 설정
  expiration-scheduler:
    fixed-delay-ms: 30000
    expire-after-seconds: 600
    batch-size: 100
  # Kafka 재고 차감 요청 생산 설정
  quantity-change-producer:
    topic: command.product.quantity-change
  # Kafka 재고 차감 요청 아웃박스 재발행 스케줄러 설정
  quantity-change-outbox-scheduler:
    fixed-delay-ms: 30000
    batch-size: 100
    retry-delay-seconds: 30
  # Kafka 재고 차감 결과 이벤트 소비 설정
  quantity-change-result-consumer:
    topic: event.product.quantity-change-result
    group-id: order-quantity-change-result-consumer

management:
  server:
    port: 8082
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  metrics:
    tags:
      application: payment-backend
    distribution:
      percentiles-histogram:
        http.server.requests: false

#env
#KAFKA_BOOTSTRAP_SERVERS=
#MYSQL_URL=
#MYSQL_USERNAME=
#MYSQL_PASSWORD=
#TOSS_PAYMENT_SECRET=
