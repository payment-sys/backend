server:
  tomcat:
    threads:
      max: 50
      min-spare: 10
    accept-count: 100
    connection-timeout: 2000ms
    keep-alive-timeout: 5s
    mbeanregistry:
      enabled: true

spring:
  threads:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/payment}
    username: ${USERNAME}
    password: ${PASSWORD}
    hikari:
      auto-commit: false
      maximum-pool-size: 18
      minimum-idle: 18

      connection-timeout: 1000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000

      register-mbeans: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          json_format_mapper: org.hibernate.type.format.jackson.JacksonJsonFormatMapper
        connection:
          provider_disables_autocommit: true
    open-in-view: false

toss:
  payment:
    #uri: https://api.tosspayments.com/v1/payments/confirm
    uri: http://10.0.2.253:8080/v1/payments/confirm
    secret: ${TOSS_PAYMENT_SECRET}
    content-type: application/json
    timeout: 2

payment:
  recovery:
    fixed-delay-ms: 30000
    stale-after-seconds: 600
    batch-size: 100

product:
  quantity-change-results:
    outbox-publish:
      fixed-delay-ms: 30000
      batch-size: 100
  cache:
    restore:
      fixed-delay-ms: 30000
    wal:
      path: ${PRODUCT_RESERVATION_WAL_PATH:./data/product-reservation.wal}
  kafka:
    producers:
      quantity-change:
        topic: ${KAFKA_TOPIC_QUANTITY_CHANGE:quantity-changes}
      quantity-change-result:
        topic: ${KAFKA_TOPIC_QUANTITY_CHANGE_RESULT:quantity-change-results}
    consumers:
      quantity-change:
        topic: ${KAFKA_TOPIC_QUANTITY_CHANGE:quantity-changes}
        group-id: ${KAFKA_GROUP_ID_QUANTITY_CHANGE:payment-product}
      quantity-change-result:
        topic: ${KAFKA_TOPIC_QUANTITY_CHANGE_RESULT:quantity-change-results}
        group-id: ${KAFKA_GROUP_ID_QUANTITY_CHANGE_RESULT:payment-order}

order:
  expiration:
    fixed-delay-ms: 30000
    expire-after-seconds: 600
    batch-size: 100
  quantity-changes:
    producer:
      topic: ${ORDER_QUANTITY_CHANGES_TOPIC:quantity-changes}
    outbox-publish:
      fixed-delay-ms: 30000
      batch-size: 100

management:
  server:
    port: 8082

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  metrics:
    tags:
      application: payment-backend
    distribution:
      percentiles-histogram:
        http.server.requests: false
