name: CI

# main 대상 PR과 main 브랜치 push에서 테스트와 이미지 빌드를 검증한다.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 배포 가능한 코드인지 먼저 테스트와 커버리지 기준으로 검증한다.
      - name: Run tests
        run: ./gradlew --no-daemon test jacocoTestCoverageVerification

      # 테스트를 통과한 애플리케이션 JAR를 생성한다.
      - name: Build bootJar
        run: ./gradlew --no-daemon bootJar

      # GHCR 로그인, Main Push 일 때만 CD가 진행되기 때문에 그때만 진행
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata 생성
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/payment-backend
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 이미지 빌드. main push 일 때만 ghcr push 진행
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}